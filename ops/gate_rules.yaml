  reader_synthesis: reader_tests/gate_a_synthesis.md
  reader_response_dir: reader_tests/responses/gate_a
  min_reader_responses: 3
  assessment_sections: []
  questions:
    - 是否愿意写第 4 章
    - 流程是否让写作更轻
