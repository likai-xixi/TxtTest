mode: commercial_serial

scope:
  main_goal: commercial_serial_monetization
  commercial_advisory_enabled: true
  platform_adaptation_enabled: true
  monetization_optimization_enabled: true
  ranking_optimization_enabled: true
  paid_conversion_enabled: true
  retention_optimization_enabled: true
  treat_legacy_commercial_tools_as_main_flow: true

ship_gates:
  always_required: true
  allow_route_to_skip_ship_gates: false

literary_reviews:
  default_blocking: false
  human_flavor_default: warning
  highlights_default: advisory
  ai_taste_default: warning

reader_feedback:
  require_real_reader: false
  allow_self_review: true
  allow_simulated_reader: true
  simulated_reader_must_be_labeled: true

infrastructure:
  sqlite_enabled: false
  vector_memory_enabled: false
  knowledge_graph_enabled: false
