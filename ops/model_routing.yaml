models:
  codex:
    role: orchestrator
    can_modify_files: true

  deepseek_generate:
    provider: deepseek
    model: deepseek-v4-pro
    mode: candidate_generation
    api_model_can_modify_files: false
    local_wrapper_writes:
      - drafts/deepseek/{chapter}.md
      - external_runs/deepseek/{chapter}/generate.prompt.md
      - external_runs/deepseek/{chapter}/generate.raw.json

  deepseek_idea:
    provider: deepseek
    model: deepseek-v4-pro
    mode: idea_lab_direction_generation
    api_model_can_modify_files: false
    local_wrapper_writes:
      - state/idea_lab/{idea_id}/deepseek_idea.md
      - external_runs/deepseek/{idea_id}/idea.raw.json

  deepseek_brief:
    provider: deepseek
    model: deepseek-v4-pro
    mode: brief_candidate_generation
    api_model_can_modify_files: false
    local_wrapper_writes:
      - drafts/deepseek/{chapter}_brief.md
      - external_runs/deepseek/{chapter}/brief.prompt.md
      - external_runs/deepseek/{chapter}/brief.raw.json

  deepseek_review:
    provider: deepseek
    model: deepseek-v4-pro
    mode: independent_review
    api_model_can_modify_files: false
    local_wrapper_writes:
      - reviews/{chapter}/deepseek_integrated_review.md
      - reviews/{chapter}/review_manifest.json
      - external_runs/deepseek/{chapter}/review.prompt.md
      - external_runs/deepseek/{chapter}/review.raw.json

  deepseek_style_review:
    provider: deepseek
    model: deepseek-v4-pro
    mode: independent_series_style_review
    api_model_can_modify_files: false
    local_wrapper_writes:
      - reviews/{chapter}/deepseek_style_review.json
      - reviews/{chapter}/deepseek_style_review.md
      - external_runs/deepseek/{chapter}/style_review.prompt.md
      - external_runs/deepseek/{chapter}/style_review.raw.json

  deepseek_preflight:
    provider: deepseek
    model: deepseek-v4-pro
    mode: connectivity_preflight
    api_model_can_modify_files: false
    local_wrapper_writes: []

environment:
  required:
    - DEEPSEEK_API_KEY
